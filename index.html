<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>班級座位隨機分配器</title>

  <!-- PWA 設定 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .dragging { opacity: 0.3; transform: scale(0.9); }
    .drag-over { border-color: #38bdf8 !important; background-color: rgba(56, 189, 248, 0.12) !important; }

    /* 6 大桌時嚴格 2 欄 3 列，100vh 零捲軸滿版 */
    .grid-fixed-6 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
    }
    /* 超過 6 桌時彈性適配 */
    .grid-dynamic-multi {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden flex flex-col font-sans select-none">

  <!-- ================= 老師端主畫面 ================= -->
  <div id="teacherView" class="h-full w-full flex flex-col">
    <!-- 頂部控制列 -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/90 backdrop-blur px-4 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2">
        <div class="p-1.5 bg-blue-600 rounded-lg text-white flex items-center justify-center">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </div>
        <h1 class="text-base font-bold tracking-wide text-white">班級座位隨機配置</h1>
      </div>

      <div class="flex items-center gap-3">
        <!-- 桌數設定 -->
        <div class="flex items-center bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-sm">
          <label for="tableCountInput" class="text-slate-400 text-xs mr-2">總桌數:</label>
          <input 
            id="tableCountInput" 
            type="number" 
            min="2" 
            max="12" 
            value="6" 
            class="w-9 bg-transparent text-amber-400 font-bold text-center focus:outline-none text-sm"
          />
          <span class="text-xs text-slate-500 ml-1">桌</span>
        </div>

        <!-- 人數設定 -->
        <div class="flex items-center bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-sm">
          <label for="studentCount" class="text-slate-400 text-xs mr-1">總人數:</label>
          <input 
            id="studentCount" 
            type="number" 
            min="1" 
            max="42" 
            value="36" 
            class="w-10 bg-transparent text-white font-bold text-center focus:outline-none text-sm"
          />
          <span id="capacityLabel" class="text-xs text-slate-500 ml-1">/ 42人</span>
        </div>

        <!-- 匿名表決按鈕 -->
        <button id="btnOpenVoteModal" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs px-3 py-1.5 rounded-lg shadow transition active:scale-95">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
          <span class="hidden sm:inline">發起表決</span>
        </button>

        <!-- 隨機洗牌按鈕 -->
        <button id="btnShuffle" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs px-3.5 py-1.5 rounded-lg shadow transition active:scale-95">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
          <span>隨機分組</span>
        </button>

        <!-- 清空重置按鈕 -->
        <button id="btnClear" class="flex items-center text-slate-400 hover:text-white text-xs px-2.5 py-1.5 rounded-lg hover:bg-slate-800 transition" title="清空座位">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </header>

    <!-- 6大桌內容區 (預設 2欄 3列) -->
    <main id="groupGrid" class="flex-1 p-2.5 gap-2.5 min-h-0 overflow-hidden grid-fixed-6"></main>
  </div>

  <!-- ================= 表決彈窗 ================= -->
  <div id="voteModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-[540px] p-6 shadow-2xl flex flex-col gap-5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <span>即時表決：是否重新抽籤換座位？</span>
        </h2>
        <button id="btnCloseVoteModal" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>

      <div class="flex gap-5 items-center">
        <!-- QR Code -->
        <div class="flex flex-col items-center bg-white p-2.5 rounded-xl shrink-0">
          <div id="qrcode"></div>
          <span class="text-[10px] text-slate-700 font-bold mt-1">同學掃描投票</span>
        </div>

        <!-- 票數統計 -->
        <div class="flex-1 flex flex-col gap-3">
          <div>
            <div class="flex justify-between text-xs font-semibold mb-1">
              <span class="text-emerald-400">贊成換座位</span>
              <span id="voteYesCount" class="text-emerald-400">0 票 (0%)</span>
            </div>
            <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
              <div id="voteYesBar" class="h-full bg-emerald-500 transition-all duration-300 w-0"></div>
            </div>
          </div>

          <div>
            <div class="flex justify-between text-xs font-semibold mb-1">
              <span class="text-rose-400">維持現狀</span>
              <span id="voteNoCount" class="text-rose-400">0 票 (0%)</span>
            </div>
            <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
              <div id="voteNoBar" class="h-full bg-rose-500 transition-all duration-300 w-0"></div>
            </div>
          </div>

          <div class="text-[11px] text-slate-400 flex justify-between items-center pt-2 border-t border-slate-800">
            <span>總票數：<strong id="voteTotalCount" class="text-white">0</strong></span>
            <span id="voteStatusText" class="text-indigo-400 font-medium">投票中...</span>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="btnResetVote" class="px-3 py-1.5 text-xs text-slate-300 hover:bg-slate-800 rounded-lg border border-slate-700 transition">清空票數</button>
        <button id="btnApplyShuffle" class="px-3.5 py-1.5 text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition">採納並洗牌</button>
      </div>
    </div>
  </div>

  <!-- ================= 學生端手機介面 ================= -->
  <div id="studentView" class="h-full w-full flex flex-col items-center justify-center p-6 bg-slate-950 hidden">
    <div class="max-w-xs w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center shadow-xl flex flex-col gap-5">
      <div>
        <h2 class="text-lg font-bold text-white mb-1">課堂匿名表決</h2>
        <p class="text-xs text-slate-400">是否贊成這節課重新抽籤換座位？</p>
      </div>

      <div id="studentVoteAction" class="flex flex-col gap-3">
        <button id="btnStudentYes" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow transition active:scale-95">
          ✔ 贊成換座位
        </button>
        <button id="btnStudentNo" class="w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm shadow transition active:scale-95">
          ✖ 維持現狀
        </button>
      </div>

      <div id="studentVoteSubmitted" class="hidden flex flex-col items-center gap-2 py-4">
        <span class="text-3xl">🎉</span>
        <h3 class="text-sm font-bold text-white">投票已送出！</h3>
        <p class="text-xs text-slate-400">請看大螢幕即時統計結果。</p>
      </div>
    </div>
  </div>

  <script>
    // 檢查是否為學生手機端投票
    const urlParams = new URLSearchParams(window.location.search);
    const isStudent = urlParams.get('vote') === 'true';

    if (isStudent) {
      document.getElementById('teacherView').classList.add('hidden');
      document.getElementById('studentView').classList.remove('hidden');

      const voteAction = document.getElementById('studentVoteAction');
      const voteSubmitted = document.getElementById('studentVoteSubmitted');

      if (localStorage.getItem('vote_submitted')) {
        voteAction.classList.add('hidden');
        voteSubmitted.classList.remove('hidden');
      }

      function vote(choice) {
        localStorage.setItem('vote_submitted', 'true');
        voteAction.classList.add('hidden');
        voteSubmitted.classList.remove('hidden');
        // 本地/廣播通知
        try {
          const currentVotes = JSON.parse(localStorage.getItem('classroom_votes') || '{"yes":0,"no":0}');
          currentVotes[choice] = (currentVotes[choice] || 0) + 1;
          localStorage.setItem('classroom_votes', JSON.stringify(currentVotes));
        } catch(e){}
      }

      document.getElementById('btnStudentYes').addEventListener('click', () => vote('yes'));
      document.getElementById('btnStudentNo').addEventListener('click', () => vote('no'));

    } else {
      // 老師端主邏輯
      const MAX_PER_TABLE = 7;
      let totalTables = 6;

      const THEME_PALETTE = [
        { bg: 'bg-blue-500/10', border: 'border-blue-500/30', badge: 'text-blue-400', desk: 'bg-blue-500/20 text-blue-400', circle: 'bg-blue-600 border-blue-400 text-white' },
        { bg: 'bg-emerald-500/10', border: 'border-emerald-500/30', badge: 'text-emerald-400', desk: 'bg-emerald-500/20 text-emerald-400', circle: 'bg-emerald-600 border-emerald-400 text-white' },
        { bg: 'bg-amber-500/10', border: 'border-amber-500/30', badge: 'text-amber-400', desk: 'bg-amber-500/20 text-amber-400', circle: 'bg-amber-600 border-amber-400 text-white' },
        { bg: 'bg-purple-500/10', border: 'border-purple-500/30', badge: 'text-purple-400', desk: 'bg-purple-500/20 text-purple-400', circle: 'bg-purple-600 border-purple-400 text-white' },
        { bg: 'bg-rose-500/10', border: 'border-rose-500/30', badge: 'text-rose-400', desk: 'bg-rose-500/20 text-rose-400', circle: 'bg-rose-600 border-rose-400 text-white' },
        { bg: 'bg-cyan-500/10', border: 'border-cyan-500/30', badge: 'text-cyan-400', desk: 'bg-cyan-500/20 text-cyan-400', circle: 'bg-cyan-600 border-cyan-400 text-white' },
        { bg: 'bg-indigo-500/10', border: 'border-indigo-500/30', badge: 'text-indigo-400', desk: 'bg-indigo-500/20 text-indigo-400', circle: 'bg-indigo-600 border-indigo-400 text-white' },
        { bg: 'bg-teal-500/10', border: 'border-teal-500/30', badge: 'text-teal-400', desk: 'bg-teal-500/20 text-teal-400', circle: 'bg-teal-600 border-teal-400 text-white' }
      ];

      let tableNames = Array.from({ length: 16 }, (_, i) => `第 ${i + 1} 組`);
      let currentGroups = Array.from({ length: totalTables }, () => []);
      let draggedItem = null;

      const container = document.getElementById('groupGrid');
      const tableCountInput = document.getElementById('tableCountInput');
      const studentCountInput = document.getElementById('studentCount');
      const capacityLabel = document.getElementById('capacityLabel');

      function updateGridClass() {
        if (totalTables === 6) {
          container.className = 'flex-1 p-2.5 gap-2.5 min-h-0 overflow-hidden grid-fixed-6';
        } else {
          container.className = 'flex-1 p-2.5 gap-2.5 min-h-0 overflow-y-auto grid-dynamic-multi';
        }
      }

      function updateCapacity() {
        const maxCapacity = totalTables * MAX_PER_TABLE;
        studentCountInput.max = maxCapacity;
        capacityLabel.innerText = `/ ${maxCapacity}人`;
        if (parseInt(studentCountInput.value, 10) > maxCapacity) {
          studentCountInput.value = maxCapacity;
        }
      }

      function renderGrid() {
        updateGridClass();
        container.innerHTML = '';

        for (let index = 0; index < totalTables; index++) {
          const theme = THEME_PALETTE[index % THEME_PALETTE.length];
          const members = currentGroups[index] || [];
          const card = document.createElement('section');
          card.className = `relative rounded-xl border ${theme.border} ${theme.bg} p-2.5 flex flex-col justify-between overflow-hidden shadow-sm`;

          // 標題列：組別字體特大 (text-lg ~ text-xl，比座號大)，支援點擊編輯
          const header = document.createElement('div');
          header.className = 'flex justify-between items-center shrink-0 mb-1 border-b border-slate-800/60 pb-1';

          const titleWrapper = document.createElement('div');
          titleWrapper.className = 'flex items-center gap-1.5 cursor-pointer group';
          titleWrapper.title = '點擊修改組別名稱';

          const titleText = document.createElement('span');
          titleText.className = `text-lg sm:text-xl font-black tracking-wide ${theme.badge} group-hover:underline flex items-center gap-1`;
          titleText.innerText = tableNames[index] || `第 ${index + 1} 組`;

          const editBadge = document.createElement('span');
          editBadge.className = 'text-[10px] text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity';
          editBadge.innerText = '✎';

          titleWrapper.appendChild(titleText);
          titleWrapper.appendChild(editBadge);

          // 原地編輯組名
          titleWrapper.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'text';
            input.value = tableNames[index];
            input.className = 'bg-slate-900 border border-indigo-500 text-white font-black text-lg px-2 py-0.5 rounded focus:outline-none w-36';

            titleWrapper.replaceWith(input);
            input.focus();
            input.select();

            function saveNewName() {
              tableNames[index] = input.value.trim() || `第 ${index + 1} 組`;
              renderGrid();
            }

            input.addEventListener('blur', saveNewName);
            input.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') saveNewName();
              if (e.key === 'Escape') renderGrid();
            });
          });

          const countInfo = document.createElement('span');
          countInfo.className = 'text-xs font-mono font-medium text-slate-400 bg-slate-900/60 px-2 py-0.5 rounded border border-slate-800';
          countInfo.innerText = `${members.length} / ${MAX_PER_TABLE} 人`;

          header.appendChild(titleWrapper);
          header.appendChild(countInfo);
          card.appendChild(header);

          // 中央桌子與雙列座位佈局
          const stage = document.createElement('div');
          stage.className = 'relative flex-1 flex flex-col justify-center items-center py-1';

          // 正方形中央桌（背景標示）
          const squareDesk = document.createElement('div');
          squareDesk.className = `absolute w-20 h-20 rounded-xl border border-dashed border-slate-700/60 ${theme.desk} flex flex-col items-center justify-center opacity-40 pointer-events-none`;
          squareDesk.innerHTML = `<span class="text-xs">☕</span><span class="text-[10px] font-bold tracking-wider mt-0.5">T-${index + 1}</span>`;
          stage.appendChild(squareDesk);

          // 席位容器（第一列 4 席、第二列 3 席）
          const seatsContainer = document.createElement('div');
          seatsContainer.className = 'relative z-10 w-full flex flex-col gap-2 items-center';

          const row1 = document.createElement('div');
          row1.className = 'flex justify-center gap-3 sm:gap-4';
          const row2 = document.createElement('div');
          row2.className = 'flex justify-center gap-3 sm:gap-4';

          for (let seatIdx = 0; seatIdx < MAX_PER_TABLE; seatIdx++) {
            const studentNumber = members[seatIdx];
            const seatElem = document.createElement('div');

            if (studentNumber !== undefined) {
              seatElem.className = `w-9 h-9 sm:w-10 sm:h-10 rounded-full border-2 ${theme.circle} flex items-center justify-center text-sm sm:text-base font-bold shadow-md cursor-grab active:cursor-grabbing hover:scale-110 transition-transform animate-pop`;
              seatElem.innerText = studentNumber;
              seatElem.draggable = true;

              seatElem.addEventListener('dragstart', (e) => {
                draggedItem = { fromGroup: index, seatIdx, number: studentNumber };
                seatElem.classList.add('dragging');
                e.dataTransfer.setData('text/plain', studentNumber);
              });
              seatElem.addEventListener('dragend', () => {
                seatElem.classList.remove('dragging');
                draggedItem = null;
              });
            } else {
              seatElem.className = 'w-9 h-9 sm:w-10 sm:h-10 rounded-full border border-dashed border-slate-700/80 bg-slate-900/40 flex items-center justify-center text-slate-600 text-xs';
              seatElem.innerHTML = `<span class="text-[10px] opacity-40 font-mono">${seatIdx + 1}</span>`;
            }

            if (seatIdx < 4) row1.appendChild(seatElem);
            else row2.appendChild(seatElem);
          }

          seatsContainer.appendChild(row1);
          seatsContainer.appendChild(row2);
          stage.appendChild(seatsContainer);
          card.appendChild(stage);

          // 跨組拖曳換位機制
          card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('drag-over'); });
          card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
          card.addEventListener('drop', (e) => {
            e.preventDefault();
            card.classList.remove('drag-over');
            if (!draggedItem || draggedItem.fromGroup === index) return;
            if (currentGroups[index].length >= MAX_PER_TABLE) {
              alert(`${tableNames[index]} 已滿員！`);
              return;
            }
            currentGroups[draggedItem.fromGroup].splice(draggedItem.seatIdx, 1);
            currentGroups[index].push(draggedItem.number);
            renderGrid();
          });

          container.appendChild(card);
        }
      }

      function shuffleStudents() {
        const maxCapacity = totalTables * MAX_PER_TABLE;
        let count = parseInt(studentCountInput.value, 10);
        if (isNaN(count) || count < 1) count = 1;
        if (count > maxCapacity) {
          count = maxCapacity;
          studentCountInput.value = maxCapacity;
        }

        const students = Array.from({ length: count }, (_, i) => i + 1);
        for (let i = students.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [students[i], students[j]] = [students[j], students[i]];
        }

        currentGroups = Array.from({ length: totalTables }, () => []);
        students.forEach((studentNum, i) => {
          currentGroups[i % totalTables].push(studentNum);
        });
        renderGrid();
      }

      // 桌數變更事件
      tableCountInput.addEventListener('change', (e) => {
        let val = parseInt(e.target.value, 10);
        if (isNaN(val) || val < 2) val = 2;
        if (val > 12) val = 12;
        totalTables = val;
        e.target.value = val;

        while (currentGroups.length < totalTables) currentGroups.push([]);
        updateCapacity();
        shuffleStudents();
      });

      // 投票彈窗控制
      const voteModal = document.getElementById('voteModal');
      const qrcodeContainer = document.getElementById('qrcode');
      let qrCodeObj = null;

      document.getElementById('btnOpenVoteModal').addEventListener('click', () => {
        voteModal.classList.remove('hidden');
        if (!qrCodeObj) {
          const currentUrl = new URL(window.location.href);
          currentUrl.searchParams.set('vote', 'true');

          qrCodeObj = new QRCode(qrcodeContainer, {
            text: currentUrl.toString(),
            width: 120,
            height: 120,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      });

      document.getElementById('btnCloseVoteModal').addEventListener('click', () => voteModal.classList.add('hidden'));
      document.getElementById('btnApplyShuffle').addEventListener('click', () => {
        voteModal.classList.add('hidden');
        shuffleStudents();
      });

      document.getElementById('btnShuffle').addEventListener('click', shuffleStudents);
      document.getElementById('btnClear').addEventListener('click', () => {
        currentGroups = Array.from({ length: totalTables }, () => []);
        renderGrid();
      });

      // 初始化
      updateCapacity();
      shuffleStudents();
    }
  </script>
</body>
</html>
